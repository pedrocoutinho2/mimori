<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Mimori</title>
<link rel="icon" href="../assets/logo-mimori.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--papel:#FBFAFD;--tinta:#241F2E;--texto2:#6E6480;--titulo:#382B55;--marca:#6E5B98;--marca-escura:#4A396F;--suave:#E7E2F3;--suave2:#EFECF4;--borda:#E3E0E8;--ok:#1F7A4F;--atencao:#8A6A10;--erro:#C4442F;--f-marca:'Grandstander',ui-rounded,system-ui,sans-serif;--f-ui:'Nunito Sans',system-ui,sans-serif;--f-texto:'Nunito Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--f-texto);font-size:15.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
h1,h2,h3{font-family:var(--f-marca);font-weight:600;color:var(--titulo);margin:0;line-height:1.1}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
.sub{margin:4px 0 0;color:var(--texto2)}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;border:0;border-radius:999px;background:var(--marca);color:#fff;font-family:var(--f-ui);font-weight:700;font-size:15px;text-decoration:none}
.btn:hover{background:var(--marca-escura)}
.btn.claro{background:#fff;color:var(--marca-escura);border:1px solid #D0C5E7}
.btn.perigo{background:#fff;color:var(--erro);border:1px solid #F0C9C1}
.btn.mini{min-height:36px;padding:0 12px;font-size:14px}
.campo{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.campo input,.campo select,.campo textarea{min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid #D0C5E7;background:#fff;font-size:15.5px;font-weight:400}
.linha{display:flex;gap:12px;flex-wrap:wrap}.linha>*{flex:1 1 160px}
.card{background:#fff;border:1px solid var(--borda);border-radius:18px}
.tabela{width:100%;border-collapse:collapse;min-width:860px}
.tabela th{padding:11px 12px;text-align:left;font-size:13px;color:var(--texto2);border-bottom:1px solid var(--borda);white-space:nowrap}
.tabela td{padding:10px 12px;border-bottom:1px solid var(--borda);vertical-align:middle}
.pil{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.app{display:flex;min-height:100vh}
.lado{flex:0 0 232px;background:#fff;border-right:1px solid var(--borda);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.lado nav{display:flex;flex-direction:column;gap:4px}
.lado nav button{min-height:44px;text-align:left;padding:0 14px;border:0;border-radius:12px;background:transparent;font-family:var(--f-ui);font-weight:700;font-size:15.5px}
.lado nav button[aria-current=page]{background:var(--suave);color:var(--marca-escura)}
.corpo{flex:1;min-width:0;padding:28px 36px 60px;display:flex;flex-direction:column;gap:18px}
.topo-sec{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--suave2);border:1px solid var(--borda);flex-shrink:0}
.veu{position:fixed;inset:0;background:rgba(36,31,46,.4);z-index:40}
.gaveta{animation:entra .42s cubic-bezier(.22,1,.36,1);position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);z-index:50;background:var(--papel);padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:-18px 0 48px rgba(36,31,46,.18)}
.modal{position:fixed;top:40px;left:50%;transform:translateX(-50%);width:min(640px,94%);max-height:calc(100% - 80px);overflow-y:auto;z-index:50;background:#fff;border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 64px rgba(36,31,46,.24)}
.bloco{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.fotos figure{margin:0;display:flex;flex-direction:column;gap:6px}
.fotos img,.fotos video{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:var(--suave2)}
.fotos .acoes{display:flex;gap:4px;flex-wrap:wrap}
.fotos select{height:32px;border-radius:8px;border:1px solid var(--borda);font-size:13px}
.icone{width:32px;height:32px;border-radius:8px;border:1px solid var(--borda);background:#fff;font-size:14px}
dl.custo{margin:0;display:grid;grid-template-columns:1fr auto;gap:5px 16px;font-size:14.5px}
dl.custo dt{color:var(--texto2)}dl.custo dd{margin:0;text-align:right}
dl.custo .total{color:var(--tinta);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpis .card{padding:16px}.kpis b{display:block;font-family:var(--f-ui);font-size:28px;color:var(--titulo)}
.barra{height:8px;border-radius:999px;background:var(--suave2);overflow:hidden}.barra i{display:block;height:100%;background:var(--marca);border-radius:999px}
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.aviso{padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;padding:12px 20px;border-radius:999px;background:var(--tinta);color:#fff;font-weight:700}
@keyframes entra{from{transform:translateX(100%)}to{transform:none}}
.veu{animation:aparece .3s ease}@keyframes aparece{from{opacity:0}}
.vit-item{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--borda);border-radius:12px;background:#fff}
.vit-item span{flex:1;min-width:0;font-weight:700;font-size:14.5px}
.sugest{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto}
.sugest button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--borda);border-radius:10px;background:#fff;padding:6px}
.sugest button:hover{background:var(--suave)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:min(440px,100%);padding:34px;display:flex;flex-direction:column;gap:16px}
@media (max-width:820px){.app{flex-direction:column}.lado{position:static;height:auto;flex-basis:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.lado nav{flex-direction:row;flex-wrap:wrap}.corpo{padding:20px 16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="camada"></div>
<div id="toast-area"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Mesmos valores do index.html. Só a chave anon (pública). Nunca a service_role. */
const SUPABASE_URL = 'https://ydnanmpqwbjzskovnhyh.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkbmFubXBxd2JqenNrb3ZuaHloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5Nzk3ODUsImV4cCI6MjEwNjU1NTc4NX0.20qoeSwPAUc5mYBOYQP5Wy2MQixFqyBulxDLsczYufA';

const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (v) => (v == null || isNaN(v) ? '–' : 'R$ ' + Number(v).toFixed(2).replace('.', ','));
const num = (x) => { const v = parseFloat(String(x == null ? '' : x).replace(',', '.')); return isNaN(v) ? null : v; };
const slugify = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const fotoUrl = (c) => (!c ? '' : /^https?:/.test(c) ? c : /^assets\//.test(c) ? '../' + c : SUPABASE_URL + '/storage/v1/object/public/produtos/' + c);
const hoje = () => new Date().toISOString().slice(0, 10);

let sb = null;
const E = { cols: [], vitrineOk: false, col: null, colBusca: '', tela: 'carregando', aba: 'produtos', eu: null, papel: '', cats: [], prods: [], par: null, promos: [], usuarios: [], busca: '', filtroCat: '', ed: null, promo: null, periodo: 30, rel: null, erro: '', toast: '', novaSenha: '', confSenha: '', convite: null };
let toastT;
function aviso(t) { E.toast = t; clearTimeout(toastT); toastT = setTimeout(() => { E.toast = ''; desenhaToast(); }, 2800); desenhaToast(); }
function desenhaToast() { const a = $('#toast-area'); if (a) a.innerHTML = E.toast ? `<div class="toast" role="status">${esc(E.toast)}</div>` : ''; }

/* ===== custo e preço ===== */
function custoDe(g, h, ins, moMin) {
  const P = E.par; if (!P || g == null || h == null) return null;
  const material = g * P.pla_kg / 1000, maquina = h * P.hora_maquina, refugo = (material + maquina) * P.refugo, mo = (moMin || 0) / 60 * P.mao_obra_hora;
  const producao = material + maquina + refugo;
  return { material, maquina, refugo, producao, emb: Number(P.embalagem), ins: ins || 0, mo, total: producao + Number(P.embalagem) + (ins || 0) + mo };
}
const custoDoProduto = (p) => (p.custo ? custoDe(num(p.custo.gramas), num(p.custo.horas), num(p.custo.insumos), num(p.custo.mao_obra_min)) : null);
const lucroDe = (preco, c) => (c ? preco - preco * E.par.taxa_link - c.total : null);
const situacao = (pr) => (pr.pausada ? 'Pausada' : hoje() < pr.inicio ? 'Agendada' : hoje() > pr.fim ? 'Encerrada' : 'Ativa');
const atinge = (pr, p) => (pr.alvo_tipo === 'produto' ? pr.alvo_produto === p.id : pr.alvo_tipo === 'categoria' ? pr.alvo_categoria === p.categoria_id : (p.tags || []).indexOf(pr.alvo_tag) >= 0);
const comDesconto = (pr, preco) => { const v = pr.tipo === 'percentual' ? preco * (1 - pr.valor / 100) : preco - pr.valor; return Math.max(0.9, Math.floor(v - 0.9) + 0.9); };
const vigente = (p) => { let m = null; E.promos.forEach((pr) => { if (situacao(pr) === 'Ativa' && atinge(pr, p)) { const v = comDesconto(pr, Number(p.preco)); if (!m || v < m.v) m = { v, nome: pr.nome }; } }); return m; };
const corLucro = (l, h) => (l == null ? 'var(--texto2)' : l < 0 ? 'var(--erro)' : h && l / h < 5 ? 'var(--atencao)' : 'var(--ok)');

/* ===== dados ===== */
async function carregaTudo() {
  const [cats, prods, par, promos, usu] = await Promise.all([
    sb.from('categorias').select('id,slug,nome,ordem').order('ordem'),
    sb.from('produtos').select('id,slug,sku,nome,preco,descricao,publicado,destaque,ordem,tags,selo,a_partir,grupos,categoria_id,atualizado_em,produto_fotos(id,caminho,tipo,ordem),produto_videos(id,caminho,ordem),variacoes(id,cor,ordem),produto_opcoes(id,nome,preco,ordem),faixas,faixa_consulta,produto_custos(gramas,horas,insumos,mao_obra_min,fonte)').order('ordem'),
    sb.from('parametros_custo').select('*').eq('id', 1).single(),
    sb.from('promocoes').select('*').order('inicio', { ascending: false }),
    sb.from('painel_usuarios').select('*').order('criado_em')
  ]);
  for (const r of [cats, prods, par, promos, usu]) if (r.error) throw r.error;
  E.cats = cats.data; E.par = par.data; E.promos = promos.data; E.usuarios = usu.data;
  const cols = await sb.from('colecoes').select('*,colecao_produtos(produto_id,ordem)').order('ordem');
  E.vitrineOk = !cols.error && (cols.data || []).some((c) => c.tipo);
  E.cols = E.vitrineOk ? cols.data.map((c) => ({ ...c, itens: (c.colecao_produtos || []).sort((a, b) => a.ordem - b.ordem).map((x) => x.produto_id) })) : [];
  E.prods = prods.data.map((p) => ({ ...p, custo: Array.isArray(p.produto_custos) ? p.produto_custos[0] : p.produto_custos, fotos: (p.produto_fotos || []).sort((a, b) => a.ordem - b.ordem), videos: (p.produto_videos || []).sort((a, b) => a.ordem - b.ordem), cores: (p.variacoes || []).sort((a, b) => a.ordem - b.ordem).map((v) => v.cor), opcoes: (p.produto_opcoes || []).sort((a, b) => a.ordem - b.ordem) }));
}
const catNome = (id) => (E.cats.find((c) => c.id === id) || {}).nome || '';

/* ===== telas ===== */
function telaLogin() {
  return `<div class="login"><form class="card" id="f-login">
    <img src="../assets/logo-mimori.svg" alt="Mimori" style="height:40px;width:auto;align-self:flex-start">
    <h1>Painel da loja</h1><p class="sub" style="margin:0">Entre com o e-mail e a senha da sua conta.</p>
    <label class="campo">E-mail<input type="email" name="email" autocomplete="username" required></label>
    <label class="campo">Senha<input type="password" name="senha" autocomplete="current-password" required></label>
    ${E.erro ? `<p role="alert" style="margin:0;color:var(--erro);font-weight:700">${esc(E.erro)}</p>` : ''}
    <button class="btn" type="submit">Entrar</button>
    <button class="btn claro" type="button" id="esqueci">Esqueci minha senha</button>
  </form></div>`;
}
function telaCriarSenha() {
  return `<div class="login"><form class="card" id="f-criar">
    <img src="../assets/logo-mimori.svg" alt="Mimori" style="height:40px;width:auto;align-self:flex-start">
    <h1>Crie sua senha</h1><p class="sub" style="margin:0">Pelo menos 10 caracteres, com letras e números.</p>
    <label class="campo">Nova senha<input type="password" name="s1" autocomplete="new-password" required minlength="10"></label>
    <label class="campo">Repita a senha<input type="password" name="s2" autocomplete="new-password" required minlength="10"></label>
    ${E.erro ? `<p role="alert" style="margin:0;color:var(--erro);font-weight:700">${esc(E.erro)}</p>` : ''}
    <button class="btn" type="submit">Salvar senha e entrar</button></form></div>`;
}
function telaApp() {
  const abas = [['produtos', 'Produtos'], ['vitrine', 'Vitrine'], ['promocoes', 'Promoções'], ['relatorios', 'Relatórios']].concat(E.papel === 'admin' ? [['usuarios', 'Usuários']] : []).concat([['conta', 'Minha conta']]);
  const corpo = { produtos: abaProdutos, vitrine: abaVitrine, promocoes: abaPromocoes, relatorios: abaRelatorios, usuarios: abaUsuarios, conta: abaConta }[E.aba]();
  return `<div class="app"><aside class="lado"><img src="../assets/logo-mimori.svg" alt="Mimori" style="height:34px;width:auto;align-self:flex-start;margin-left:8px">
    <nav aria-label="Painel">${abas.map((a) => `<button type="button" data-aba="${a[0]}" aria-current="${E.aba === a[0] ? 'page' : 'false'}">${a[1]}</button>`).join('')}</nav>
    <div style="margin-top:auto;font-size:13px;color:var(--texto2)">Conectado como<br><b style="color:var(--tinta);word-break:break-all">${esc(E.eu.email)}</b><br><button class="btn claro mini" type="button" id="sair" style="margin-top:8px">Sair</button></div></aside>
    <main class="corpo">${corpo}</main></div>`;
}
function abaProdutos() {
  const b = E.busca.toLowerCase();
  const vis = E.prods.filter((p) => (!E.filtroCat || p.categoria_id === E.filtroCat) && (!b || (p.nome + ' ' + (p.sku || '')).toLowerCase().indexOf(b) >= 0));
  if (!E.prods.length) return `<div><h1>Produtos</h1><p class="sub">O banco ainda está vazio.</p></div><div class="card" style="padding:24px;display:flex;flex-direction:column;gap:12px;max-width:620px"><h2>Importar o catálogo inicial</h2><p style="margin:0">Traz as peças do arquivo do site (preço, descrição, tags, cores, fotos e vídeos) e os pesos e tempos de partida para o cálculo de custo. É para usar uma vez só.</p>${E.importando ? `<p role="status" style="margin:0;font-weight:700">${esc(E.importando)}</p>` : `<button class="btn" type="button" id="importar" style="align-self:flex-start">Importar o catálogo</button>`}</div>`;
  return `<div class="topo-sec"><div><h1>Produtos</h1><p class="sub">${E.prods.length} produtos, ${E.prods.filter((p) => p.publicado).length} no site</p></div><button class="btn" type="button" data-editar="novo">+ Novo produto</button></div>
  <div class="linha"><input type="search" id="busca" value="${esc(E.busca)}" placeholder="Buscar por nome ou código" aria-label="Buscar" style="flex:1 1 320px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #D0C5E7">
    <select id="filtro-cat" aria-label="Categoria" style="flex:0 0 240px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid #D0C5E7"><option value="">Todas as categorias</option>${E.cats.map((c) => `<option value="${c.id}" ${E.filtroCat === c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></div>
  <div class="card" style="overflow-x:auto"><table class="tabela"><thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Lucro</th><th>Fotos</th><th>No site</th><th><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden">Ações</span></th></tr></thead><tbody>
  ${vis.map((p) => {
    const pv = vigente(p), preco = pv ? pv.v : Number(p.preco), c = custoDoProduto(p), l = lucroDe(preco, c), h = p.custo ? num(p.custo.horas) : null;
    const reais = p.fotos.filter((f) => f.tipo === 'real').length;
    const ft = !p.fotos.length ? ['Sem foto', '#FBE3DF', 'var(--erro)'] : reais ? ['Foto real', '#E1F2E8', 'var(--ok)'] : ['Foto do criador', '#FFF4D6', 'var(--atencao)'];
    return `<tr><td><span style="display:flex;align-items:center;gap:12px">${p.fotos[0] ? `<img class="thumb" src="${esc(fotoUrl(p.fotos[0].caminho))}" alt="">` : '<span class="thumb"></span>'}<span><b style="font-family:var(--f-ui)">${esc(p.nome)}</b><br><small style="color:var(--texto2)">${esc(p.sku || 'sem código')}</small></span></span></td>
      <td style="color:var(--texto2)">${esc(catNome(p.categoria_id))}</td>
      <td style="white-space:nowrap">${pv ? `<s style="color:var(--texto2);font-size:13px">${brl(p.preco)}</s><br>` : ''}<b style="font-family:var(--f-ui);color:var(--marca)">${brl(preco)}</b>${p.opcoes && p.opcoes.length ? `<br><small style="color:var(--texto2)">${p.opcoes.length} ${p.opcoes.length === 1 ? 'opção' : 'opções'}</small>` : ''}${pv ? `<br><small style="color:var(--atencao);font-weight:700">${esc(pv.nome)}</small>` : ''}</td>
      <td style="white-space:nowrap"><b style="font-family:var(--f-ui);color:${corLucro(l, h)}">${l == null ? 'sem custo' : brl(l)}</b><br><small style="color:var(--texto2)">${l == null ? 'falta peso e tempo' : Math.round(l / preco * 100) + '% · ' + brl(l / h) + '/h'}</small></td>
      <td><span class="pil" style="background:${ft[1]};color:${ft[2]}">${ft[0]}</span></td>
      <td><span class="pil" style="background:${p.publicado ? 'var(--suave)' : 'var(--suave2)'};color:${p.publicado ? 'var(--marca-escura)' : 'var(--texto2)'}">${p.publicado ? 'Publicado' : 'Oculto'}</span></td>
      <td style="text-align:right"><button class="btn claro mini" type="button" data-editar="${p.id}">Editar</button></td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function custoHTML(ed) {
  const g = num(ed.gramas), h = num(ed.horas), c = custoDe(g, h, num(ed.insumos) || 0, num(ed.mao_obra_min)), preco = num(ed.preco);
  if (!c) return '<p style="margin:0;color:var(--texto2)">Preencha filamento e tempo de produção para calcular o custo.</p>';
  const l = preco != null ? lucroDe(preco, c) : null, P = E.par;
  return `<dl class="custo"><dt>Filamento</dt><dd>${String(g).replace('.', ',')} g</dd><dt>Tempo de produção</dt><dd>${String(h).replace('.', ',')} h</dd>
    <dt class="total">Custo de produção</dt><dd class="total">${brl(c.producao)}</dd>

(async function () {
